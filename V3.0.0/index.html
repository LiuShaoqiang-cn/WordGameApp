<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字练练看小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="game-container">
        <div class="start-screen" id="startScreen">
            <h1>汉字练练看</h1>
            <p>匹配汉字与其对应的拼音，完成所有关卡挑战！<br>随机生成的字词库，每次游戏都有新体验！</p>
            <button id="startButton">开始游戏</button>
        </div>
        <div class="header">
            <div>关卡: <span id="level">1</span>/6</div>
            <div>时间: <span id="time">00:00</span></div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="footer">
            <div>进度: <span id="remaining">24</span>/<span id="total">24</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="message"></div>
            <div class="controls">
                <button id="hintButton">提示</button>
                <button id="soundToggle" class="sound-toggle">声音: 开</button>
            </div>
        </div>
    </div>
    <div class="modal" id="levelModal">
        <div class="modal-content">
            <h2>恭喜过关！</h2>
            <p>用时: <span id="levelTime">00:00</span></p>
            <button id="nextLevelBtn">下一关</button>
        </div>
    </div>
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>游戏结束！</h2>
            <p>您已完成所有关卡！</p>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
